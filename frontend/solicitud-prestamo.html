<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Préstamo de Documentos · Coraza C.T.A.</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --border: #334155;
      --primary: #0284c7;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-box {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      height: 50px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(2,132,199,0.3);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #16a34a);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2,132,199,0.4);
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2,132,199,0.6);
    }
  </style>
</head>
<body>

<div class="card-box">
  <div class="header">
    <img src="logo.png" alt="Coraza Logo">
    <h2>CORAZA SEGURIDAD C.T.A.</h2>
    <p>Solicitud Oficial de Préstamo de Documentos / Carpetas Físicas</p>
  </div>

  <form id="formSolicitudPublica" onsubmit="enviarSolicitudPrestamo(event)">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Nombre Completo del Solicitante *</label>
      <input type="text" id="solNombre" required placeholder="Ej: Juan Carlos Pérez">
    </div>

    <div class="form-group">
      <label><i class="fas fa-id-card"></i> Cédula de Ciudadanía *</label>
      <input type="text" id="solCedula" required placeholder="Ej: 1039482710">
    </div>

    <div class="form-group">
      <label><i class="fas fa-building"></i> Departamento / Área *</label>
      <select id="solDepartamento" required>
        <option value="">-- Seleccionar Área --</option>
        <option value="JURIDICO">Gestión Jurídica y Contratos</option>
        <option value="CONTABILIDAD">Gestión Financiera / Contabilidad</option>
        <option value="OPERACIONES">Operaciones y Servicios</option>
        <option value="GESTION_HUMANA">Gestión Humana y Talento</option>
        <option value="GERENCIA">Gerencia General</option>
        <option value="SUPERVISION">Supervisión de Puestos</option>
        <option value="SST">Seguridad y Salud en el Trabajo (SST)</option>
        <option value="OTRO">Otro Departamento</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fas fa-folder-open"></i> Documento / Carpeta Solicitada (Ej: Carpeta #362 Tierra Grata) *</label>
      <input type="text" id="solDocumento" required placeholder="Ej: Carpeta #362 - Tierra Grata Cumbres o Contrato #25">
    </div>

    <div class="form-group">
      <label><i class="fas fa-comment-alt"></i> Motivo del Préstamo *</label>
      <textarea id="solMotivo" rows="3" required placeholder="Describa el motivo o trámite para el cual requiere el documento..."></textarea>
    </div>

    <div class="form-group">
      <label><i class="fas fa-calendar-alt"></i> Fecha Estimada de Devolución *</label>
      <input type="date" id="solFechaDevolucion" required>
    </div>

    <button type="submit" class="btn-submit" id="btnEnviar">
      <i class="fas fa-paper-plane"></i> ENVIAR SOLICITUD DE PRÉSTAMO
    </button>
  </form>
</div>

<script>
  // Ajustar fecha mínima de devolución a mañana
  const tom = new Date();
  tom.setDate(tom.getDate() + 1);
  document.getElementById('solFechaDevolucion').min = tom.toISOString().substring(0, 10);
  document.getElementById('solFechaDevolucion').value = tom.toISOString().substring(0, 10);

  async function enviarSolicitudPrestamo(e) {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando Solicitud...';

    const data = {
      nombre: document.getElementById('solNombre').value.trim(),
      cedula: document.getElementById('solCedula').value.trim(),
      departamento: document.getElementById('solDepartamento').value,
      documento: document.getElementById('solDocumento').value.trim(),
      motivo: document.getElementById('solMotivo').value.trim(),
      fechaDevolucion: document.getElementById('solFechaDevolucion').value
    };

    try {
      const res = await fetch('/api/public/solicitud-prestamo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();

      if (json.success) {
        Swal.fire({
          icon: 'success',
          title: '✅ Solicitud Registrada con Éxito',
          text: `Tu radicado de solicitud es ${json.id}. El Administrador de Archivo revisará tu petición para aprobación.`,
          confirmButtonColor: '#0284c7'
        }).then(() => {
          document.getElementById('formSolicitudPublica').reset();
        });
      } else {
        Swal.fire('Error', json.message || 'No se pudo registrar la solicitud.', 'error');
      }
    } catch(err) {
      Swal.fire('Error de Conexión', 'No se pudo contactar con el servidor SGD Coraza.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> ENVIAR SOLICITUD DE PRÉSTAMO';
    }
  }
</script>
</body>
</html>
